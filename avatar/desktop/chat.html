<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f3ea">
<title>SYLPHY Â· Lavender Sanctuary</title>
<style>
:root{color-scheme:light;font-family:Inter,"Segoe UI",system-ui,sans-serif;--page:#f7f3ea;--page-glow:#fffdf8;--page-edge:#e9e1ef;--panel:rgba(255,255,255,.68);--panel-solid:#fffdfa;--lav:#ded6eb;--lav-deep:#a99abb;--gold:#c8a96b;--ink:#554e68;--muted:#898197;--line:rgba(154,137,174,.22);--user:#d8cce6;--assistant:rgba(255,255,255,.82);--field:rgba(255,255,255,.8);--shadow:rgba(101,83,120,.10)}
:root[data-theme="dark"]{color-scheme:dark;--page:#211e2b;--page-glow:#302a3c;--page-edge:#171520;--panel:rgba(43,38,56,.88);--panel-solid:#302a3d;--lav:#40364f;--lav-deep:#aa96c1;--gold:#d5b878;--ink:#eee7f4;--muted:#b6a9c4;--line:rgba(207,187,225,.17);--user:#554667;--assistant:rgba(58,51,72,.94);--field:#292435;--shadow:rgba(0,0,0,.25)}
*{box-sizing:border-box}html,body{width:100%;height:100%;min-width:0;min-height:0;margin:0;overflow:hidden}body{color:var(--ink);background:radial-gradient(ellipse at 80% 15%,var(--page-glow) 0,var(--page) 42%,var(--page-edge) 100%);transition:background .2s,color .2s}
#shell{width:100%;height:100%;min-width:0;min-height:0;display:grid;grid-template-columns:minmax(280px,.92fr) minmax(300px,1.08fr);gap:14px;padding:14px}
.chat-panel{min-width:0;min-height:0;border:1px solid var(--line);border-radius:26px;background:var(--panel);backdrop-filter:blur(22px);box-shadow:0 18px 55px var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.chat-head{height:76px;flex-shrink:0;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);-webkit-app-region:drag}
.identity{display:flex;align-items:center;gap:11px}.identity-mark{width:38px;height:38px;border-radius:13px;background:var(--lav);color:var(--ink);display:grid;place-items:center;font-size:18px}.identity strong{display:block;font-family:Georgia,serif;font-size:18px;font-weight:600;letter-spacing:.02em;color:var(--ink)}.identity small{display:block;margin-top:3px;color:var(--muted);font-size:10px;letter-spacing:.14em}
.online{font-size:11px;color:#7eaa8a;display:flex;align-items:center;gap:7px}.online i{width:7px;height:7px;border-radius:50%;background:#8fb99a;box-shadow:0 0 10px #8fb99a66}
#messages{flex:1;min-height:0;overflow:auto;padding:22px 20px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}.welcome{margin:auto 0 8px;color:var(--muted);font-family:Georgia,serif;font-size:15px;text-align:center;opacity:.9}.msg{max-width:88%;padding:12px 15px;border-radius:18px;font-size:13px;line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 3px 12px var(--shadow)}.msg.user{align-self:flex-end;background:var(--user);color:var(--ink);border-bottom-right-radius:6px}.msg.assistant{align-self:flex-start;background:var(--assistant);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:6px}.msg.thinking{align-self:flex-start;color:var(--muted);font-style:italic;font-size:12px;background:var(--lav)}.msg.err{align-self:flex-start;color:#b66c70;background:#f8e8e7;border:1px solid #edd0cf}
#input-area{padding:13px 15px 15px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:flex-end;background:var(--panel)}#input{flex:1;min-width:0;max-height:112px;resize:none;border:1px solid var(--line);border-radius:17px;background:var(--field);padding:12px 14px;color:var(--ink);font-family:inherit;font-size:13px;line-height:1.5;outline:none}#input:focus{border-color:var(--lav-deep);box-shadow:0 0 0 3px var(--lav)}#input::placeholder{color:var(--muted)}.round{width:40px;height:40px;flex-shrink:0;border-radius:50%;border:1px solid var(--line);background:var(--panel-solid);color:var(--muted);display:grid;place-items:center;cursor:pointer;font-size:15px}.round.send{background:linear-gradient(145deg,var(--lav-deep),#89769f);border:0;color:white;font-size:18px}.round:disabled{opacity:.4;cursor:not-allowed}
.character-panel{position:relative;min-width:0;min-height:0;border-radius:28px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse at 52% 22%,var(--page-glow) 0,var(--lav) 100%);box-shadow:0 18px 55px var(--shadow)}.character-panel:before{content:"";position:absolute;inset:12px;border:1px solid color-mix(in srgb,var(--gold) 42%,transparent);border-radius:21px;pointer-events:none;z-index:2}.character-top{position:absolute;z-index:3;top:22px;left:25px;right:25px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.eyebrow{font-size:9px;letter-spacing:.18em;color:var(--muted)}.presence{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 11px;color:#7eaa8a;font-size:10px;box-shadow:0 4px 14px var(--shadow)}.avatar-frame{position:absolute;inset:0;overflow:hidden}.avatar-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}.character-caption{position:absolute;z-index:3;bottom:25px;left:25px;right:25px;text-align:center;pointer-events:none}.character-caption strong{display:block;font-family:Georgia,serif;font-size:20px;font-weight:500;color:var(--ink)}.character-caption span{font-size:10px;color:var(--muted);letter-spacing:.12em}
.window-actions{display:flex;gap:6px;-webkit-app-region:no-drag;align-items:center}.window-actions button{border:1px solid var(--line);background:var(--panel);color:var(--muted);min-width:28px;height:28px;padding:0 8px;border-radius:9px;cursor:pointer;font:11px system-ui}.window-actions button:hover{background:var(--lav)}
.compact-hint{display:none;position:absolute;z-index:4;right:18px;bottom:14px;padding:6px 9px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--ink);font-size:10px;cursor:pointer}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--lav-deep);border-radius:8px}
@media(max-width:560px),(max-height:300px){#shell{display:block;padding:0}.chat-panel{display:none}.character-panel{position:absolute;inset:0;border-radius:0;border:0;box-shadow:none}.character-panel:before{inset:5px;border-radius:12px}.character-top{top:10px;left:12px;right:12px}.eyebrow{display:none}.character-caption{bottom:12px}.character-caption strong{font-size:15px}.character-caption span{font-size:8px}.compact-hint{display:block}}
@media(min-width:561px) and (max-width:820px){#shell{grid-template-columns:minmax(240px,.92fr) minmax(250px,1.08fr);gap:9px;padding:9px}.chat-panel{border-radius:22px}.character-panel{border-radius:22px}.character-panel:before{inset:8px}}
</style>
</head>
<body>
<div id="shell">
  <section class="chat-panel">
    <header class="chat-head">
      <div class="identity"><div class="identity-mark">âœ¦</div><div><strong>Sylphy</strong><small>YOUR LOCAL COMPANION</small></div></div>
      <div style="display:flex;align-items:center;gap:14px"><div class="online"><i id="dot"></i><span id="connection-label">Connecting</span></div><div class="window-actions"><button id="theme-toggle" title="Äá»•i giao diá»‡n sÃ¡ng/tá»‘i" aria-label="Äá»•i giao diá»‡n">â˜¾</button><button id="minimize" title="Thu nhá»">âˆ’</button></div></div>
    </header>
    <div id="messages"><div class="welcome">A little place for us.</div></div>
    <div id="input-area"><textarea id="input" placeholder="Nháº¯n tin vá»›i Sylphyâ€¦" rows="1"></textarea><button class="round" id="speak-btn" title="PhÃ¡t láº¡i giá»ng nÃ³i">â™«</button><button class="round send" id="send" title="Gá»­i">â†‘</button></div>
  </section>
  <section class="character-panel" aria-label="Sylphy avatar">
    <div class="character-top"><span class="eyebrow">A QUIET CORNER OF YOUR WORLD</span><span class="presence">â— Online</span></div>
    <div class="avatar-frame"><iframe title="Sylphy VRM Avatar" src="../dist/index.html?embed=avatar"></iframe></div>
    <div class="character-caption"><strong>Sylphy</strong><span>HERE WITH YOU</span></div><button class="compact-hint" id="expand-window" title="Má»Ÿ rá»™ng Sanctuary">Má»Ÿ rá»™ng â†—</button>
  </section>
</div>
<script>
const SESSION='sylphy-main';
const msgsEl=document.getElementById('messages'),inputEl=document.getElementById('input'),sendBtn=document.getElementById('send'),speakBtn=document.getElementById('speak-btn'),dot=document.getElementById('dot'),connectionLabel=document.getElementById('connection-label');
let waiting=false,polling=false,seenIds=new Set(),lastText='';const pendingUserNodes=[];
function addMsg(role,text,id){if(id&&seenIds.has(role+id))return;if(id)seenIds.add(role+id);const d=document.createElement('div');d.className='msg '+role;if(id)d.dataset.mid=id;d.dataset.role=role;d.textContent=text;msgsEl.appendChild(d);msgsEl.querySelector('.welcome')?.remove();msgsEl.scrollTop=msgsEl.scrollHeight;if(role==='assistant')lastText=text;}
function addPendingUserMsg(text){const d=document.createElement('div');d.className='msg user';d.dataset.role='user';d.dataset.pendingText=text;d.textContent=text;msgsEl.appendChild(d);pendingUserNodes.push(d);msgsEl.querySelector('.welcome')?.remove();msgsEl.scrollTop=msgsEl.scrollHeight;return d;}
function reconcileUserMsg(message){if(!message||!message.text)return;const id=message.message_id?String(message.message_id)+'u':null;if(id&&seenIds.has('user'+id))return;const index=pendingUserNodes.findIndex(node=>node.isConnected&&node.dataset.pendingText===message.text);if(index>=0){const [node]=pendingUserNodes.splice(index,1);if(id){node.dataset.mid=id;seenIds.add('user'+id);}delete node.dataset.pendingText;return;}addMsg('user',message.text,id);}
function removePendingUserMsg(node){const index=pendingUserNodes.indexOf(node);if(index>=0)pendingUserNodes.splice(index,1);node?.remove();}
let thinkEl=null;function showThink(){if(thinkEl)return;thinkEl=document.createElement('div');thinkEl.className='msg thinking';thinkEl.textContent='Sylphy Ä‘ang nghÄ©â€¦';msgsEl.appendChild(thinkEl);msgsEl.scrollTop=msgsEl.scrollHeight;}function hideThink(){if(thinkEl){thinkEl.remove();thinkEl=null;}}function unlock(){waiting=false;sendBtn.disabled=false;speakBtn.disabled=false;}
async function doSend(){const text=inputEl.value.trim();if(!text||waiting)return;inputEl.value='';inputEl.style.height='auto';waiting=true;sendBtn.disabled=true;speakBtn.disabled=true;const pending=addPendingUserMsg(text);showThink();try{const result=await window.sylphyChat.send(text,SESSION);if(!result||!result.accepted){removePendingUserMsg(pending);hideThink();addMsg('err','Daemon chÆ°a nháº­n tin. HÃ£y kiá»ƒm tra Entity Runtime.');unlock();}else{void poll();}}catch(error){removePendingUserMsg(pending);hideThink();addMsg('err','Lá»—i káº¿t ná»‘i: '+error.message);unlock();}}
async function poll(){if(polling)return;polling=true;try{const history=await window.sylphyChat.history(SESSION);if(!Array.isArray(history)){dot.style.background='#c98c82';connectionLabel.textContent='Offline';return;}dot.style.background='#8fb99a';connectionLabel.textContent='Online';for(const message of history){if(message.role==='user'&&message.text)reconcileUserMsg(message);else if(message.role==='assistant'&&!document.querySelector('[data-mid="'+message.message_id+'"]')){if(message.status==='completed'&&message.text){hideThink();addMsg('assistant',message.text,message.message_id);unlock();}else if(message.status==='failed'){hideThink();addMsg('err','KhÃ´ng thá»ƒ táº¡o pháº£n há»“i.',message.message_id+'e');unlock();}}}}catch{dot.style.background='#c98c82';connectionLabel.textContent='Offline';}finally{polling=false;}}
speakBtn.addEventListener('click',async()=>{if(!lastText)return;speakBtn.disabled=true;try{await window.sylphyChat.speak(lastText);}catch{}setTimeout(()=>speakBtn.disabled=false,1500);});sendBtn.addEventListener('click',doSend);inputEl.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();doSend();}});inputEl.addEventListener('input',()=>{inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,112)+'px';});document.getElementById('minimize').addEventListener('click',()=>window.sylphyChat.minimize());(async()=>{await poll();setInterval(poll,1800);})();
const themeButton=document.getElementById('theme-toggle');
const THEME_KEY='sylphy-sanctuary-theme';
function applyTheme(mode){const resolved=mode==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):mode;document.documentElement.dataset.theme=resolved;document.documentElement.dataset.themeMode=mode;themeButton.textContent=mode==='dark'?'â˜€':mode==='system'?'â—':'â˜¾';themeButton.title='Theme: '+mode+' (nháº¥n Ä‘á»ƒ Ä‘á»•i)';document.querySelector('meta[name="theme-color"]')?.setAttribute('content',resolved==='dark'?'#211e2b':'#f7f3ea');}
let themeMode=localStorage.getItem(THEME_KEY)||'light';if(!['light','dark','system'].includes(themeMode))themeMode='light';applyTheme(themeMode);
themeButton.addEventListener('click',()=>{themeMode=themeMode==='light'?'dark':themeMode==='dark'?'system':'light';localStorage.setItem(THEME_KEY,themeMode);applyTheme(themeMode);});
const systemTheme=matchMedia('(prefers-color-scheme: dark)');systemTheme.addEventListener?.('change',()=>{if(themeMode==='system')applyTheme('system');});
async function expandSanctuary(){try{await window.sylphyChat.expand();}catch(error){console.error('Could not expand Sanctuary',error);}}
document.getElementById('expand-window').addEventListener('click',expandSanctuary);
document.querySelector('.character-panel').addEventListener('dblclick',expandSanctuary);


// Read-only Voice -> Avatar iframe bridge.
(() => {
  const frame = document.querySelector('.avatar-frame iframe');
  if (!frame || !window.sylphyChat?.voiceStatus) {
    console.error('[SYLPHY] Voice bridge unavailable');
    return;
  }

  let disposed = false;
  let timer = 0;
  let inFlight = false;

  const pollVoice = async () => {
    if (disposed || inFlight) return;
    inFlight = true;

    let snapshot = null;
    try {
      snapshot = await window.sylphyChat.voiceStatus();
    } catch (error) {
      console.warn('[SYLPHY] Voice status unavailable', error);
    } finally {
      inFlight = false;
    }

    if (disposed) return;

    if (snapshot && typeof snapshot === 'object') {
      frame.contentWindow?.postMessage({
        type: 'sylphy:voice-snapshot',
        payload: snapshot
      }, window.location.origin);
    }

    const speaking = snapshot?.enabled === true
      && snapshot?.is_speaking === true
      && snapshot?.state === 'playing';

    timer = window.setTimeout(pollVoice, speaking ? 50 : 180);
  };

  const start = () => {
    if (!disposed) void pollVoice();
  };

  frame.addEventListener('load', start);
  if (frame.contentDocument?.readyState === 'complete') start();

  window.addEventListener('beforeunload', () => {
    disposed = true;
    window.clearTimeout(timer);
  }, { once: true });
})();
</script>
</body></html>
